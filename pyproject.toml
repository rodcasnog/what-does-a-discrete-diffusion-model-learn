[project]
name = "what-does-a-discrete-diffusion-model-learn"
version = "0.1.0"
description = "Denoiser, cavity and score coordinates of one discrete diffusion reverse process"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Rodrigo Casado Noguerales" }]
requires-python = ">=3.11"
dependencies = [
    "flax>=0.12.7",
    "jax>=0.10.0; sys_platform == 'darwin'",
    "jax[cuda13]>=0.10.0; sys_platform == 'linux'",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.11.37",
    "numpy>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.34",
    "pyarrow>=15.0.0",
    "transformers>=4.57.3",
    "torch>=2.9.1",
    "mauve-text>=0.4.0",
    "wandb>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "discrete_diffusion"

[tool.uv]
# cuDNN below 9.26 builds no attention plan on CUDA 13.
override-dependencies = ["nvidia-cublas>=13.2", "nvidia-cudnn-cu13>=9.26; sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
